# GTA4 - ReXGlue Codegen Configuration
# PAL port: base 7 + TU5 (0.0.5.7). GENERATED by tools/xex/build_pal_config.py from the US
# v8 config; do not edit by hand - change the US config or tools/xex/manual_map.json and rerun.

skip_lr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
skip_msr = false
cr_as_local = false
non_argument_as_local = false
non_volatile_as_local = false

[analysis]
max_jump_extension = 65536
data_region_threshold = 16
large_function_threshold = 1048576

# rexcrt: Replace statically-linked PPC CRT functions with native implementations.
# Addresses verified via IDA Pro Hex-Rays decompilation + xref tracing.
# Format: FunctionName = guest_address
[rexcrt]
# String/memory CRT (verified PR #180 — corrected pass 3)
# FLIRT (dolphin.sig/gow3.sig) trust-flags the libc entries:
#   memset = 0x829FF440 (357 callers, pure leaf, classic stb+rlwimi+stw pattern)
#   memcpy = 0x82A009C0 (577 callers, pure leaf, dcbt+ld/std cache-line aware)
# Using the wrong addresses silently corrupted memory on 149+161 call sites,
# cascading into the XObject::GetNativeObject null crash post-DrawPrim.
memset   = 0x829FF440   # 357 callers - leaf, stb/rlwimi fill + stw loop
memcpy   = 0x82A009C0   # 577 callers - leaf, dcbt-prefetched ld/std copy
_stricmp = 0x829FF8F0   # 477 xrefs - A-Z case folding (cmpwi 0x41/0x5A + ori r6,r6,0x20)
strncmp  = 0x82A008D0   # 113 xrefs - byte compare with count (subfc. + bdnzf null-stop)
strncpy  = 0x82A007A0   # 101 xrefs - copy with null-pad remainder
strchr   = 0x82A00760   #  34 xrefs - lbz + cmpwi null + cmpw char match + lbzu advance
strrchr  = 0x82A02000   #  30 xrefs - forward scan saving last match position, returns ptr or NULL
strstr   = 0x829FF748   #  25 xrefs - nested byte-compare loops for substring search

# New additions (FLIRT verified 2026-04-18 via dolphin.sig + gow3.sig)
memmove = 0x82A01A40              # 40 xrefs — native rexcrt_memmove in memory.cpp

# Heap and file wrappers intentionally remain raw recompiled code. Their native
# RexGlue replacements do not preserve every guest heap, TLS, async I/O, status,
# timestamp, or attribute behavior.

