# GTA4 - ReXGlue Codegen Configuration
# PAL port: base 7 + TU5 (0.0.5.7). US-only [rexcrt]/[functions] addresses
# removed until remapped (docs/PAL-PORT.md phase 3).

skip_lr = false
ctr_as_local = false
xer_as_local = false
reserved_as_local = false
skip_msr = false
cr_as_local = false
non_argument_as_local = false
