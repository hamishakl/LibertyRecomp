# Xbox 360 parity: world/population/reflection settings back to the original game's values.
# The port's defaults raise these well above the 360 (draw distance 3x, shadows 2x, population 1.25x,
# 1080p reflections), which drives draw counts (4-7k/frame in the city) and GPU time.
# Launch with:  tools/perf/play_preset.sh xbox360-parity   (your native.toml is left untouched)
gta4_draw_distance_scale = 1.0
gta4_shadow_distance_scale = 1.0
gta4_traffic_density_scale = 1.0
gta4_parked_car_density_scale = 1.0
gta4_ped_density_scale = 1.0
gta4_scenario_ped_density_scale = 1.0
gta4_reflection_resolution = "original"
gta4_streaming_budget_scale = 1.0
