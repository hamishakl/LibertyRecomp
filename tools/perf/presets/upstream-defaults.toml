# Upstream's raised world settings (the fork's defaults until 2026-10-10): draw distance 3x,
# shadows 2x, population 1.25x, 1080p reflections, 1.5x streaming budget.
# On an M4 at 1440p these ran at 34 fps with 70 ms spikes against 50 fps flat at parity, and the
# extra population did not actually spawn (the streaming budget starved it), so parity is now the
# default. Launch with:  tools/perf/play_preset.sh upstream-defaults
gta4_draw_distance_scale = 3.0
gta4_shadow_distance_scale = 2.0
gta4_traffic_density_scale = 1.25
gta4_parked_car_density_scale = 1.25
gta4_ped_density_scale = 1.25
gta4_scenario_ped_density_scale = 1.25
gta4_reflection_resolution = "1080p"
gta4_streaming_budget_scale = 1.5
